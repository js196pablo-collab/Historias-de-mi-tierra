<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detectives del teatro</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f7f5f0;
        color: #292929;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
    }

    .contenedor {
        max-width: 850px;
        margin: 0 auto;
        padding: 35px 22px 50px;
    }

    header {
        border-bottom: 1px solid #d8d3ca;
        padding-bottom: 22px;
        margin-bottom: 30px;
    }

    .etiqueta {
        display: inline-block;
        font-size: 13px;
        font-weight: bold;
        color: #8b4a2f;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 600;
        color: #33302d;
    }

    .introduccion {
        margin: 0;
        color: #625d57;
        font-size: 16px;
        max-width: 700px;
    }

    .instruccion {
        background: #eee9df;
        border-left: 4px solid #c76b3c;
        padding: 15px 18px;
        margin: 25px 0 30px;
        color: #49443f;
    }

    .escena {
        background: white;
        border: 1px solid #ddd8d0;
        padding: 28px;
        margin-bottom: 35px;
    }

    .escena h2 {
        margin-top: 0;
        font-size: 21px;
        font-weight: 600;
        color: #403b37;
    }

    .escena-texto {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.8;
    }

    .acotacion {
        color: #77716b;
        font-style: italic;
    }

    .pregunta {
        background: white;
        border: 1px solid #ddd8d0;
        padding: 24px;
        margin-bottom: 18px;
    }

    .numero {
        color: #a85a35;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .pregunta h3 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 16px;
        color: #33302d;
    }

    label {
        display: block;
        padding: 9px 10px;
        margin: 5px 0;
        cursor: pointer;
        border: 1px solid transparent;
    }

    label:hover {
        background: #f6f2eb;
        border-color: #e2ddd5;
    }

    input[type="radio"] {
        margin-right: 8px;
        accent-color: #a85a35;
    }

    .boton {
        background: #a85a35;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 10px;
    }

    .boton:hover {
        background: #8f492b;
    }

    .resultado {
        display: none;
        margin-top: 30px;
        background: #eee9df;
        border: 1px solid #d8d1c6;
        padding: 25px;
    }

    .resultado h2 {
        margin-top: 0;
        font-size: 22px;
        color: #403b37;
    }

    .resultado p {
        margin-bottom: 10px;
    }

    .correcto {
        color: #386641;
        font-weight: bold;
    }

    .error {
        color: #9b3022;
        font-weight: bold;
    }

    .insignias {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0;
    }

    .insignia {
        border: 1px solid #cfc8bd;
        background: #f8f5ef;
        padding: 7px 11px;
        font-size: 13px;
        color: #5d5751;
    }

    .pie {
        margin-top: 40px;
        padding-top: 18px;
        border-top: 1px solid #d8d3ca;
        color: #77716b;
        font-size: 13px;
        text-align: center;
    }

    @media (max-width: 600px) {
        .contenedor {
            padding: 25px 15px 40px;
        }

        h1 {
            font-size: 27px;
        }

        .escena,
        .pregunta {
            padding: 20px;
        }
    }
</style>
</head>
